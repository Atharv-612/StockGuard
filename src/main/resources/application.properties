spring.application.name=stockguard
server.port=8080

# Database Configuration (MySQL as Primary)
# Provide DB_URL, DB_USERNAME, DB_PASSWORD as environment variables in production.
# The fallback values below are for LOCAL DEVELOPMENT ONLY. Never commit real credentials here.
stockguard.db.url=${DB_URL:jdbc:mysql://localhost:3306/stockguard_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
stockguard.db.username=${DB_USERNAME:root}
stockguard.db.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT Configuration
# JWT_SECRET must be a Base64-encoded 256-bit+ random string. Generate with:
#   openssl rand -base64 32
# NEVER commit the real value. Set it as an environment variable in production.
stockguard.jwt.secret=${JWT_SECRET:CHANGE_THIS_BEFORE_RUNNING_IN_PRODUCTION_USE_OPENSSL_RAND}
stockguard.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
stockguard.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS: comma-separated list of trusted frontend origins.
# Example: http://localhost:3000,https://app.yourdomain.com
stockguard.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080}

# WhatsApp Cloud API Configuration (all secrets via environment variables)
stockguard.whatsapp.api-token=${WHATSAPP_API_TOKEN:}
stockguard.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
stockguard.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
stockguard.whatsapp.mock-mode=${WHATSAPP_MOCK_MODE:true}
stockguard.whatsapp.api-version=v18.0

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Rate Limiting (login attempts per minute per IP)
stockguard.security.login-rate-limit=${LOGIN_RATE_LIMIT:10}

# Production: set to true to enforce HTTPS
stockguard.security.require-https=${REQUIRE_HTTPS:false}
