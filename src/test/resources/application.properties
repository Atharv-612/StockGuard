spring.application.name=stockguard-test

# In-Memory H2 for Fast Isolated Automated Tests
spring.datasource.url=jdbc:h2:mem:stockguard_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Secret for Tests
stockguard.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
stockguard.jwt.expiration-ms=86400000

# Rate Limiter for Tests
stockguard.security.rate-limit.enabled=true
stockguard.security.rate-limit.login-max=5
stockguard.security.rate-limit.notifications-max=10

# WhatsApp Mock
stockguard.whatsapp.mock-mode=true
